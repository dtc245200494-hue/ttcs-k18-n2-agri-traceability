<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRI TRACEABILITY - Đăng nhập</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 420px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .brand {
      text-align: center;
      color: #1d7a43;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #1d7a43;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #155d32;
    }

    #message {
      min-height: 24px;
      margin-top: 15px;
      text-align: center;
      color: #d32f2f;
    }

    .demo {
      margin-top: 20px;
      padding: 12px;
      background: #f3f8f4;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="brand">
      AGRI TRACEABILITY
    </div>

    <h1>Đăng nhập</h1>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="user@example.com"
        required
      >

      <label for="password">Mật khẩu</label>

      <input
        type="password"
        id="password"
        name="password"
        placeholder="Nhập mật khẩu"
        required
      >

      <button type="submit">
        Đăng nhập
      </button>

      <div id="message"></div>

    </form>

    <div class="demo">
      <b>Tài khoản demo</b><br><br>
      Email: user@example.com<br>
      Mật khẩu: Password@123
    </div>

  </div>

  <script>

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    const params = new URLSearchParams(
      window.location.search
    );

    const returnTo =
      params.get("returnTo") || "/lots";

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.textContent = "Đang đăng nhập...";
      message.style.color = "#555";

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      try {

        const response = await fetch("/api/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email: email,
            password: password,
            returnTo: returnTo
          })

        });

        const data = await response.json();

        if (response.ok) {

          message.textContent =
            "Đăng nhập thành công!";

          message.style.color = "green";

          setTimeout(function() {
            window.location.href =
              data.redirectTo || "/lots";
          }, 500);

        } else {

          message.textContent =
            data.message ||
            "Đăng nhập không thành công.";

          message.style.color = "red";
        }

      } catch (error) {

        message.textContent =
          "Không thể kết nối máy chủ.";

        message.style.color = "red";

      }

    });

  </script>

</body>
</html>
