<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agri Traceability</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 64px auto; padding: 0 20px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 24px; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Agri Traceability</h1>
    <p>Khung ứng dụng Sprint 1 đã chạy.</p>
    <p id="status">Đang kiểm tra backend...</p>
  </main>
  <script>
    fetch("/api/health")
      .then((response) => {
        if (!response.ok) throw new Error("Backend chưa sẵn sàng");
        return response.json();
      })
      .then((data) => {
        document.getElementById("status").textContent =
          "Backend: " + data.status + " | PostgreSQL: " + data.database;
      })
      .catch((error) => {
        document.getElementById("status").textContent = error.message;
      });
  </script>
</body>
</html>
