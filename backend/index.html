<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRI TRACEABILITY - Đăng nhập</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 400px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1d7a43;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1d7a43;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: red;
    }

    .demo {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>AGRI TRACEABILITY</h1>

  <h2>Đăng nhập</h2>

  <form id="loginForm">

    <label>Email</label>
    <input
      type="email"
      id="email"
      value="user@example.com"
      required
    >

    <label>Mật khẩu</label>
    <input
      type="password"
      id="password"
      value="Password@123"
      required
    >

    <button type="submit">Đăng nhập</button>

    <div id="message"></div>

  </form>

  <div class="demo">
    Tài khoản demo:<br>
    Email: user@example.com<br>
    Mật khẩu: Password@123
  </div>
</div>

<script>
  document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get("returnTo") || "/lots";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password,
            returnTo
          })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = data.redirectTo;
        } else {
          message.textContent = data.message;
        }

      } catch (error) {
        message.textContent = "Không thể kết nối máy chủ.";
      }
    });
</script>

</body>
</html>
